<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Normal English</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="hero">
    <div class="hero-content">
        <div class="hero-left">
            <img src="../images/hero.png" alt="anya" class="teacher-img">
        </div>
        <div class="hero-right">
            <h1>NORMAL<br>ENGLISH</h1>
            <p class="subtitle">вместе с Аней</p>

            <a href="#contact" class="main-button">Записаться</a>

            <div class="nav-buttons">
                <a href="#video">Мой подход</a>
                <a href="#reviews">Отзывы</a>
                <a href="#about">Обо мне</a>
            </div>
        </div>
    </div>
</header>

<section id="video" class="video-section">
    <div class="video-wrapper">
        <iframe
        src="https://www.youtube.com/embed/JnRsUeJGjrA?si=agUMJV3xWAbqtvJF"
        frameborder="0"
        allowfullscreen
        ></iframe>
    </div>
</section>

<section id="reviews" class="reviews-section">
    <h2>ОТЗЫВЫ</h2>
    <div class="review-container">
        <div class="slides">
            <div class="slide"><img src="../images/review1.jpg" alt="review"></div>
            <div class="slide"><img src="../images/review2.jpg" alt="review"></div>
            <div class="slide"><img src="../images/review3.jpg" alt="review"></div>
        </div>
        <button class="arrow left">&#10094;</button>
        <button class="arrow right">&#10095;</button>
    </div>
</section>

<section id="contact" class="contact-section">
    <h2>ЗАПИСАТЬСЯ</h2>

    <div class="form-wrapper">
        <iframe
            src=""
            frameborder="0"
        ></iframe>
    </div>
</section>

<script src="../js/script.js"></script>
</body>
</html>

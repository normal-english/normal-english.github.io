<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Normal English</title>

    <meta http-equiv="refresh" content="0; url=/ru/">

    <script>
        (function () {
            const savedLang = localStorage.getItem('siteLang');
            if (savedLang) {
                window.location.replace('/' + savedLang + '/');
                return;
            }
            const path = window.location.pathname;

            if (path.startsWith('/ru/') || path.startsWith('/en/')) return;

            const lang = navigator.language ||navigator.userLanguage;
            const isRussian = lang && lang.toLowerCase().startsWith('ru');
            const target = isRussian ? 'ru' : 'en';

            localStorage.setItem('siteLang', target);

            window.location.replace('/' + target + '/');
        })();
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
